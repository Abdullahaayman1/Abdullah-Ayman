<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#6d8bff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6d8bff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#05060c" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5eead4" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Dark Rounded App Background -->
  <rect width="64" height="64" rx="18" fill="#070913" stroke="#1b2038" stroke-width="2" />
  <rect width="64" height="64" rx="18" fill="url(#glow)" />
  
  <!-- Stylized AA Monogram with Neon Stroke -->
  <g filter="url(#shadow)">
    <!-- First A -->
    <path d="M15 48 L27 16 L35 37" fill="none" stroke="url(#neon)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bridge -->
    <path d="M20 38 L30 38" fill="none" stroke="url(#neon)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Second A overlapping -->
    <path d="M30 48 L39 16 L49 48" fill="none" stroke="url(#neon)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M35 38 L45 38" fill="none" stroke="url(#neon)" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>